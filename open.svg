  <rect width="750" height="1100" fill="#0e1114"/>
  <rect x="40" y="40" width="670" height="1020" fill="none" stroke="#2a2e32"/>
  <rect x="80" y="88" width="72" height="72" fill="none" stroke="#c4453c"/>
  <text x="116" y="134" text-anchor="middle" font-family="Songti SC, STSong, serif" font-size="22" fill="#c4453c">筹</text>
  <text x="80" y="230" font-family="Songti SC, STSong, serif" font-size="64" fill="#e8e4dc">筹算</text>
  <text x="80" y="278" font-family="Songti SC, STSong, serif" font-size="22" fill="#8b8680">A 股与场内基金量化台</text>
  <text x="80" y="360" font-family="Songti SC, STSong, serif" font-size="26" fill="#e8e4dc">行情、因子、回测、模拟盘。</text>
  <text x="80" y="402" font-family="Songti SC, STSong, serif" font-size="26" fill="#e8e4dc">红涨绿跌。资金存在这台设备。</text>
  <text x="80" y="500" font-family="Songti SC, STSong, serif" font-size="22" fill="#c4453c">规则</text>
  <text x="80" y="548" font-family="Songti SC, STSong, serif" font-size="24" fill="#e8e4dc">· 收盘出信号，次日开盘成交</text>
  <text x="80" y="592" font-family="Songti SC, STSong, serif" font-size="24" fill="#e8e4dc">· T+1，佣金万一 2.5</text>
  <text x="80" y="636" font-family="Songti SC, STSong, serif" font-size="24" fill="#e8e4dc">· 卖出印花税 0.05%，一手 100 股</text>
  <text x="80" y="760" font-family="Songti SC, STSong, serif" font-size="22" fill="#8b8680">历史回测不代表未来收益。</text>
  <text x="80" y="800" font-family="Songti SC, STSong, serif" font-size="22" fill="#8b8680">内容不是投资建议。</text>
  <text x="80" y="980" font-family="Songti SC, STSong, serif" font-size="18" fill="#8b8680">拂尘 · 筹算 · 开窍 · 玄鉴</text>
</svg>
